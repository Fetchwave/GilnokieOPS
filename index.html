<title>Gilnokie Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&family=Jost:wght@500;600;700&display=swap" rel="stylesheet">
<style>:root{
  --ink:#111111;        /* Gilnokie black */
  --volt:#E0E123;       /* Gilnokie yellow */
  --paper:#F6F6F2;      /* page */
  --card:#FFFFFF;
  --line:#E4E4DE;
  --mute:#6B6B66;
  --good:#1E8E4E; --warn:#C77700; --bad:#C62E2E;
  --display:"Jost","Futura","Century Gothic",sans-serif;
  --body:"Figtree","Helvetica Neue",Arial,sans-serif;
  --r:14px; --gap:20px;
  /* layout: fixed black sidebar + 12-col content grid, 20px rhythm */
  color-scheme:light;
}
*{box-sizing:border-box}
html{height:100%}body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font:500 14px/1.45 var(--body);display:grid;grid-template-columns:248px 1fr}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--volt);outline-offset:2px}

/* sidebar */
.side{background:var(--ink);color:#fff;display:flex;flex-direction:column;padding:24px 16px;gap:24px;position:sticky;top:0;height:100vh}
.brand{display:flex;flex-direction:column;gap:8px;padding:0 8px}
.brand svg{width:170px;height:auto}
.brand small{font:600 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--volt)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#cfcfcf;text-decoration:none;font-weight:600}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover{background:#1e1e1e;color:#fff}
.nav a.on{background:var(--volt);color:var(--ink)}
.nav .sep{height:1px;background:#262626;margin:8px 4px}
.foot{margin-top:auto;padding:12px;border:1px solid #262626;border-radius:12px;display:flex;flex-direction:column;gap:4px}
.foot span{font-size:11px;color:#8a8a8a;text-transform:uppercase;letter-spacing:.12em}
.foot b{font:600 15px var(--display);color:#fff}
.foot b i{font-style:normal;color:var(--volt)}

/* main */
main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:rgba(246,246,242,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:16px 32px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top h1{font:600 26px/1 var(--display);margin:0;text-transform:uppercase;letter-spacing:.02em;margin-right:auto}
.sample{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:var(--volt);padding:6px 10px;border-radius:999px}
.view{padding:24px 32px 40px;display:flex;flex-direction:column;gap:var(--gap)}

/* controls */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--mute);white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--volt)}
.sel,.inp{height:36px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:0 14px;font-weight:600}
.inp{border-radius:10px}
.btn{height:36px;border:0;border-radius:999px;padding:0 18px;background:var(--volt);color:var(--ink);font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.04em;font-size:12px}
.btn.ghost{background:var(--card);border:1px solid var(--line)}
.btn:hover{filter:brightness(.95)}
.custom{display:none;gap:8px;align-items:center}
.custom.on{display:flex}
.chk{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--mute)}

/* grid + cards */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--gap)}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.card h2{font:600 15px/1.2 var(--display);text-transform:uppercase;letter-spacing:.06em;margin:0}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:24px}
.card .hd small{color:var(--mute);font-weight:600}
.kpi{gap:8px}
.kpi .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.kpi .val{font:600 32px/1 var(--display);font-variant-numeric:tabular-nums}
.kpi .delta{font-weight:700;font-size:13px}
.kpi.hero{background:var(--ink);color:#fff;border-color:var(--ink)}
.kpi.hero .lbl{color:#9a9a9a}.kpi.hero .val{color:var(--volt)}
.up{color:var(--good)}.down{color:var(--bad)}.kpi.hero .up{color:#7be3a5}.kpi.hero .down{color:#ff8a8a}
.chart{position:relative;height:280px}
.chart.sm{height:220px}

/* tables */
.tw{overflow-x:auto;margin:0 -20px -20px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:11px 20px;border-top:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:700;background:#FAFAF7;position:sticky;top:0;cursor:pointer;user-select:none}
td.n,th.n{text-align:right}
tbody tr:hover{background:#FBFBEA}
tr.click{cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.p-retail{background:#F2F3C2;color:#4b4c00}.p-wh{background:var(--ink);color:var(--volt)}
.p-good{background:#E3F4EA;color:var(--good)}.p-warn{background:#FFF1DC;color:var(--warn)}.p-bad{background:#FBE4E4;color:var(--bad)}
.sw{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.15);display:inline-block}
.bar-in{height:8px;background:#EEEEE8;border-radius:99px;overflow:hidden;min-width:90px}
.bar-in i{display:block;height:100%;background:var(--ink)}
.bar-in i.lo{background:var(--bad)}.bar-in i.mid{background:var(--warn)}
.list{display:flex;flex-direction:column}
.list .row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.list .row:first-child{border-top:0}
.muted{color:var(--mute)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--volt);border-color:var(--ink)}
.note{border-left:4px solid var(--volt);background:var(--card);padding:12px 16px;border-radius:0 10px 10px 0;color:#333}
.empty{padding:32px;text-align:center;color:var(--mute)}

/* drawer */
.drawer{position:fixed;inset:0 0 0 auto;width:min(520px,100%);background:var(--card);transform:translateX(100%);transition:transform .2s;z-index:20;display:flex;flex-direction:column}
.drawer.on{transform:none;box-shadow:-20px 0 40px rgba(0,0,0,.15)}
.drawer header{background:var(--ink);color:#fff;padding:20px 24px;display:flex;justify-content:space-between;align-items:center}
.drawer header h3{font:600 20px var(--display);margin:0;text-transform:uppercase}
.drawer header button{background:var(--volt);border:0;border-radius:999px;width:32px;height:32px;font-weight:800;cursor:pointer}
.drawer .body{padding:24px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 16px}
.kv dt{color:var(--mute);font-weight:600}.kv dd{margin:0;font-weight:600}

@media (max-width:1100px){.c3{grid-column:span 6}.c4,.c5,.c7,.c8,.c6{grid-column:span 12}}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}

.drawer td{white-space:normal}.drawer .tw{margin:0 -20px -20px}
.drawer td.n{white-space:nowrap}
.p-pos{background:#ECECCB;color:#4b4c00}
.grow{flex:1;min-width:180px}
.prod{display:flex;align-items:center;gap:12px}
.th{width:36px;height:36px;border-radius:8px;flex:none;overflow:hidden;border:1px solid var(--line);display:block}
.th img,.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.share{display:flex;align-items:center;gap:10px}.share .bar-in{width:110px}.share span{width:44px;text-align:right;font-variant-numeric:tabular-nums}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--gap)}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:box-shadow .15s,transform .15s}
.pcard:hover{box-shadow:0 10px 24px rgba(0,0,0,.08);transform:translateY(-2px)}
.pimg{position:relative;aspect-ratio:4/3;overflow:hidden}
.pimg.big{border-radius:var(--r);aspect-ratio:16/10}
.ptag{position:absolute;top:12px;left:12px}
.pbody{padding:16px 20px 20px;display:flex;flex-direction:column;gap:14px;flex:1}
.pbody h3{font:600 17px/1.25 var(--display);margin:0 0 4px}
.pnum{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.pnum .lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.pnum b{font:600 24px/1.1 var(--display);font-variant-numeric:tabular-nums}
.mx{width:100%;border-collapse:collapse;font-size:13px}
.mx th,.mx td{padding:6px 8px;border-top:1px solid var(--line);text-align:right;position:static;background:none;cursor:default}
.mx th:first-child,.mx td:first-child{text-align:left;padding-left:0}
.mx thead th{border-top:0;font-size:11px}
.q-out{color:var(--bad);font-weight:800}.q-low{color:var(--warn);font-weight:800}
@media (prefers-reduced-motion:reduce){.pcard{transition:none}}
.btn{white-space:nowrap;flex:none}
.card .hd:has(.tabs){align-items:flex-start}
.pimg.big{flex:none;width:100%}
.drawer .kv{grid-template-columns:200px 1fr}
.pimg,.pimg.big{aspect-ratio:1/1}
.p-tag{background:#111;color:var(--volt);font-weight:700}
.grow-sp{flex:1}

let seed = 20261106;
const rnd = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;

function labelTables(root) {
  root.querySelectorAll("table:not(.mx)").forEach(t => {

    const names = [];
    if (head) [...head.cells].forEach(th => { for (let i = 0; i < (th.colSpan || 1); i++) names.push(th.textContent.replace(/[▲▼↑↓]/g, "").trim()); });
    t.classList.add("stack");
    [...t.tBodies].forEach(tb => {
      const held = []; // columns still covered by a cell from a row above (rowspan)
      [...tb.rows].forEach(tr => {
        let c = 0;
        tr.classList.toggle("cont", held.some(n => n > 0));
        tr.classList.toggle("sum", (tr.cells[0]?.colSpan || 1) > 1 && tr.cells.length > 1);
        [...tr.cells].forEach(td => {
          while (held[c] > 0) c++;
          const span = td.colSpan || 1;
          td.classList.toggle("t0", c === 0);
          if (span > 1 || td.classList.contains("empty")) td.classList.add("full");

/* update the view in place while someone is typing, so the phone keyboard stays open */
function morphInto(el, html) {
  const t = document.createElement(el.tagName); t.innerHTML = html;
  const sync = (a, b) => {
    const ac = [...a.childNodes], bc = [...b.childNodes];
    bc.forEach((y, i) => {
      const x = ac[i];
      if (!x) { a.appendChild(y); return; }
      const control = x.nodeType === 1 && /^(INPUT|SELECT|TEXTAREA|CANVAS)$/.test(x.tagName);
      if (x.nodeType !== y.nodeType || x.nodeName !== y.nodeName || (control && x !== document.activeElement)) { a.replaceChild(y, x); return; }
      if (x.nodeType !== 1) { if (x.data !== y.data) x.data = y.data; return; }
      for (const at of [...x.attributes]) if (!y.hasAttribute(at.name)) x.removeAttribute(at.name);
      for (const at of [...y.attributes]) if (at.name !== "value" && x.getAttribute(at.name) !== at.value) x.setAttribute(at.name, at.value);
      if (x !== document.activeElement) sync(x, y);
    });
    for (let i = ac.length - 1; i >= bc.length; i--) ac[i].remove();
  };
  sync(el, t);
}

    const p = { sku: key, realSku: v.sku, vid: v.variant_id, barcode: v.barcode, t: v.product_title, r: rangeOf(v.product_title), size, col,
      img: v.image_url, inR: 1, inW: 1, status: v.product_status };
    CATALOG.push(p); BY_SKU[key] = p;
    const byLoc = {}; for (const l of ALL_LOCS) byLoc[l.id] = Number(v.by_location?.[l.id] ?? 0);
    const k = { byLoc, total: v.total, s7: v.sold_7, s30: v.sold_30, daily: v.sold_30 / 30, tracked: true, counted: v.last_count_at ? new Date(v.last_count_at) : null };
    Object.defineProperty(k, "avail", { get() { return S.stockLoc ? (this.byLoc[S.stockLoc] ?? 0) : this.total; } });
    Object.defineProperty(k, "cover", { get() { return this.daily ? Math.floor(this.avail / this.daily) : (this.avail > 0 ? 999 : 0); } });
    Object.defineProperty(k, "state", { get() { const a = this.avail; if (a <= 0) return "out"; return this.daily && a / this.daily < 14 ? "low" : "ok"; } });
    STOCK[key] = k;
  }
  sellable = CATALOG.filter(p => p.r !== "Packs" && p.r !== "Other");

  /* sales (admins only; factory logins get nothing back here by design) */
  ORDERS = [];
  if (ROLE === "admin") {
    const [orders, lines] = await Promise.all([
      all(() => sb.from("orders").select("store_id,order_id,order_number,channel,source_name,location_id,staff_user_id,created_at,cancelled_at,financial_status,fulfillment_status,total,current_total,total_shipping,discount_codes,customer_name,company,ship_city,ship_province,is_test").eq("is_test", false).order("created_at", { ascending: false })),
      all(() => sb.from("sales_lines").select("store_id,order_id,sku,variant_id,product_title,variant_title,net_qty,net_sales,refunded_qty,sold_by,pos_location"))
    ]);
    const byOrder = {};
    for (const l of lines) (byOrder[l.store_id + ":" + l.order_id] ??= []).push(l);
    const locNameById = Object.fromEntries(ALL_LOCS.map(l => [l.id, l.name]));
    const posNames = new Set(), staffBy = {};
    for (const o of orders) {
      const ls = byOrder[o.store_id + ":" + o.order_id] || [];
      const loc = o.channel === "wholesale" ? "Wholesale" : o.channel === "pos" ? (locNameById[String(o.location_id)] || "POS") : "Online store";
      const out = [];
      for (const l of ls) {
        let key = keyOf(l.sku, l.variant_id);
        if (o.store_id === "wholesale" && !BY_SKU[key]) key = l.sku && BY_SKU[l.sku] ? l.sku : key;
        if (!BY_SKU[key]) { const p = { sku: key, t: l.product_title || "Unknown item", r: rangeOf(l.product_title || ""), size: "", col: tidyColour(l.variant_title || ""), inR: 0, inW: 0 }; BY_SKU[key] = p; }
        out.push({ sku: key, qty: Number(l.net_qty), price: Number(l.net_qty) ? Number(l.net_sales) / Number(l.net_qty) : 0, refundedQty: Number(l.refunded_qty) });
      }
      const sub = ls.reduce((s, l) => s + Number(l.net_sales), 0);
      const staff = ls[0]?.sold_by || null;
      if (o.channel === "pos") { posNames.add(loc); if (staff) (staffBy[loc] ??= new Set()).add(staff); }
      ORDERS.push({
        key: o.store_id + ":" + o.order_id, id: o.order_number, ch: o.store_id, src: o.channel === "wholesale" ? "draft" : o.channel, loc, staff,
        at: new Date(o.created_at), customer: o.company || o.customer_name || (o.channel === "pos" ? "Walk-in customer" : "Unknown"), company: o.company,
        prov: o.ship_province || (o.channel === "pos" ? "In store" : "Unknown"), city: o.ship_city || (o.channel === "pos" ? loc : ""),
        code: (o.discount_codes || [])[0] || null, lines: out, sub, disc: 0, ship: Number(o.total_shipping || 0),
        refunded: !!o.cancelled_at, total: Number(o.current_total ?? o.total ?? 0), pairs: out.reduce((s, l) => s + l.qty, 0),
        status: o.cancelled_at ? "Cancelled" : (o.financial_status === "refunded" ? "Refunded" : o.fulfillment_status === "fulfilled" ? "Fulfilled" : o.financial_status === "pending" ? "Awaiting payment" : "Unfulfilled")
      });
    }
    POS_LOCS = [...posNames].sort().map(n => [n, 0, [...(staffBy[n] || [])].sort()]);
    CHANNELS = ["Online store", ...POS_LOCS.map(p => p[0]), "Wholesale"];
    CHANNELS.forEach(chCol);
    PROV = [...new Set(ORDERS.map(o => o.prov).filter(Boolean))].sort().map(p => [p, 0, []]);
    CODES = [null, ...new Set(ORDERS.map(o => o.code).filter(Boolean))];
    const whMap = {};
    for (const o of ORDERS.filter(o => o.ch === "wholesale")) whMap[o.customer] ??= [o.customer, o.prov, o.city];
    WH = Object.values(whMap);
  }

  /* events + transfers */
  const [evs, trs, tls] = await Promise.all([
    all(() => sb.from("events").select("*").order("starts_on", { ascending: false })),
    all(() => sb.from("transfers").select("*").order("created_at", { ascending: false })),
    all(() => sb.from("transfer_lines").select("transfer_id,qty"))
  ]);
  const today = dayOf(NOW);
  EVENTS = await Promise.all(evs.map(async e => {
    const { data: rows } = await sb.rpc("get_event_report", { p_event: e.id });
    const r = (rows || []).map(x => {
      const key = Object.values(BY_SKU).find(p => p.vid === x.variant_id)?.sku || keyOf(x.sku, x.variant_id);
      if (!BY_SKU[key]) BY_SKU[key] = { sku: key, t: x.product_title || "Unknown", r: "Other", size: "", col: tidyColour(x.variant_title) };
      return { sku: key, sent: x.sent, sold: x.sold, returned: x.returned, unacc: x.unaccounted, value: Number(x.sales_value) };
    });
    const t = k => r.reduce((s, x) => s + x[k], 0);
    const upcoming = e.starts_on > today;
    return { id: e.id, tag: e.tag, name: e.name, from: e.starts_on, to: e.ends_on, rows: r, orders: null,
      sent: t("sent"), sold: t("sold"), returned: t("returned"), unacc: t("unacc"), value: t("value"),
      status: upcoming ? "Upcoming" : e.ends_on >= today ? "Live" : t("returned") ? "Closed" : "Awaiting return" };
  }));
  const linesBy = {}; for (const l of tls) { const x = linesBy[l.transfer_id] ??= { n: 0, q: 0 }; x.n++; x.q += l.qty; }
  TRANSFERS = trs.map(t => ({ id: "TR-" + t.id, dbId: t.id, at: new Date(t.completed_at || t.created_at), from: String(t.from_location), to: String(t.to_location),
    event: EVENTS.find(e => e.id === t.event_id) || null, pairs: linesBy[t.id]?.q || 0, lines: linesBy[t.id]?.n || 0,
    status: t.status === "done" ? "Done" : t.status === "draft" ? "Draft" : "Cancelled" }));

  /* system checks */
  const [neg, mism, pend, fail, unm, conn] = await Promise.all([
    Promise.resolve(Object.values(STOCK).reduce((s, k) => s + Object.entries(k.byLoc).filter(([id, q]) => q < 0 && LOCS.some(l => l.id === id)).length, 0)),
    sb.from("stock_mismatches").select("variant_id", { count: "exact", head: true }),
    sb.from("stock_movements").select("id", { count: "exact", head: true }).eq("push_status", "pending"),
    sb.from("stock_movements").select("id", { count: "exact", head: true }).eq("push_status", "failed"),
    ROLE === "admin" ? sb.from("order_lines").select("line_id", { count: "exact", head: true }).is("variant_id", null) : Promise.resolve({ count: null }),
    sb.rpc("connection_status")
  ]);
  CHECKS = { negatives: neg, mismatches: mism.count ?? 0, pending: pend.count ?? 0, failed: fail.count ?? 0, unmatched: unm.count,
    noSku: CATALOG.filter(p => !p.realSku).length, noBarcode: CATALOG.filter(p => !p.barcode).length, conn: conn.data || [] };
}

/* ---- login gate ---- */
function showLogin(msg) {
  document.body.classList.add("locked");
  $("#gate").innerHTML = `<form class="login" id="loginForm">
      <div class="brand">${document.querySelector(".brand svg").outerHTML}<small>Operations</small></div>
      <h2>Sign in</h2>
      <label for="em">Email</label><input class="inp" id="em" type="email" autocomplete="username" required>
      <label for="pw">Password</label><input class="inp" id="pw" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit">Sign in</button>
      <p class="err">${esc(msg || "")}</p>
      <span class="pw">Powered by <b>Fetch<i>wave</i></b></span>
    </form>`;
  $("#gate").classList.add("on");
}
function busy(on, text) { $("#gate").classList.toggle("on", on); if (on) $("#gate").innerHTML = `<div class="loading"><span class="spin"></span>${esc(text || "Loading live data…")}</div>`; }

async function afterLogin() {
  busy(true);
  const { data: role, error } = await sb.rpc("my_role");
  if (error || !role) { await sb.auth.signOut(); return showLogin("This login has no access yet. Ask an admin to add you."); }
  ROLE = role;
  document.body.classList.remove("locked");
  document.body.dataset.role = role;
  try { await loadAll(); } catch (e) { busy(false); $("#view").innerHTML = `<div class="note">Could not load data: ${esc(e.message)}</div>`; return; }
  busy(false);
  $("#who").textContent = (await sb.auth.getUser()).data.user?.email || "";
  if (role !== "admin" && ["", "#dashboard", "#sales", "#orders", "#wholesale"].includes(location.hash)) location.hash = "#products";
  document.querySelector(".sample")?.remove();
  route();
}
async function refresh(msg) { busy(true, msg || "Updating…"); try { await loadAll(); } finally { busy(false); } route(); }

function BOOT() {
  document.addEventListener("submit", async e => {
    if (e.target.id !== "loginForm") return;
    e.preventDefault();
    const btn = e.target.querySelector("button"); btn.disabled = true; btn.textContent = "Signing in…";
    const { error } = await sb.auth.signInWithPassword({ email: $("#em").value.trim(), password: $("#pw").value });
    if (error) { showLogin("Email or password is wrong."); return; }
    afterLogin();
  });
  document.addEventListener("click", async e => {
    if (e.target.closest("#signOut")) { await sb.auth.signOut(); location.hash = ""; showLogin(); }
    if (e.target.closest("#reload")) refresh("Refreshing…");
  });
  sb.auth.getSession().then(({ data }) => data.session ? afterLogin() : showLogin());
}

const kpi = (lbl, val, d, hero) => `<div class="card kpi c3 ${hero ? "hero" : ""}"><span class="lbl">${lbl}</span><span class="val">${val}</span>${d}</div>`;
const thumb = p => `<span class="th" style="background:${hexFor(p.col)}">${p.img ? `<img src="${p.img}" alt="" loading="lazy" onerror="this.remove()">` : ""}</span>`;

function totals(os) {
  const s = os.reduce((s, o) => s + net(o), 0), n = os.length, p = os.reduce((s, o) => s + (o.refunded ? 0 : o.pairs), 0);
  return { s, n, p, aov: n ? s / n : 0 };
}
function days() { const [a, b] = rangeFor(S.preset); const n = Math.max(1, Math.round((b - a) / 864e5)); return { a, n, lab: Array.from({ length: n }, (_, i) => dShort(addDays(a, i))) }; }
function byDayChannel(os) {
  const { a, n, lab } = days(), sets = {};
  os.forEach(o => { const i = Math.floor((o.at - a) / 864e5); if (i < 0 || i >= n) return; (sets[o.loc] ??= Array(n).fill(0))[i] += net(o); });
  return { lab, sets: CHANNELS.filter(c => sets[c]).map(c => ({ label: c, data: sets[c], backgroundColor: chCol(c), borderRadius: 3, stack: "s" })) };
}
function byChannel(os) { return CHANNELS.map(c => ({ c, s: os.filter(o => o.loc === c).reduce((t, o) => t + net(o), 0), n: os.filter(o => o.loc === c).length })).filter(x => x.n); }
const stackOpts = { maintainAspectRatio: false, plugins: { legend: { position: "top", align: "end", labels: { boxWidth: 10, boxHeight: 10 } }, tooltip: { callbacks: { label: c => `${c.dataset.label}: ${R(c.raw)}` } } },
  scales: { x: { stacked: true, grid: { display: false }, ticks: { maxTicksLimit: 10 } }, y: { stacked: true, grid: { color: "#EEEEE8" }, ticks: { callback: money } } } };
const donut = (el, rows) => charts.push(new Chart(el, { type: "doughnut", data: { labels: rows.map(r => r.c), datasets: [{ data: rows.map(r => r.s), backgroundColor: rows.map(r => chCol(r.c)), borderWidth: 2, borderColor: "#fff" }] },
  options: { maintainAspectRatio: false, cutout: "66%", plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `${c.label}: ${R(c.raw)}` } } } } }));
const chList = rows => { const t = rows.reduce((s, r) => s + r.s, 0) || 1; return `<div class="list">${rows.map(r => `<div class="row"><span><span class="sw" style="background:${chCol(r.c)}"></span> ${r.c} <span class="muted">· ${N(r.n)} orders</span></span><b>${R(r.s)} <span class="muted">${(r.s / t * 100).toFixed(0)}%</span></b></div>`).join("")}</div>`; };

/* ===== STOCK (one pool across online, POS and wholesale) ===== */
const SIZE_ORDER = ["11-2", "3-7", "8-12", "13-16", "xs", "s", "m", "l", "xl", "Small", "Medium", "Large"];
const sizeSort = (a, b) => (SIZE_ORDER.indexOf(a) + 1 || 99) - (SIZE_ORDER.indexOf(b) + 1 || 99);
const stPill = st => st === "out" ? `<span class="pill p-bad">Out of stock</span>` : st === "low" ? `<span class="pill p-warn">Low stock</span>` : `<span class="pill p-good">In stock</span>`;
const qtyCls = s => s.state === "out" ? "q-out" : s.state === "low" ? "q-low" : "";

/* only products on sale in Shopify by default; archived, draft and unlisted sit in their own view */
const onSale = p => !p.status || p.status === "active";
const inShow = p => S.stockShow === "hidden" ? !onSale(p) : onSale(p);
const STATUS_LBL = { archived: "Archived", draft: "Draft", unlisted: "Unlisted" };

function stockProducts() {
  const q = S.stockQ.toLowerCase(), m = new Map();
  CATALOG.filter(p => p.r !== "Other" && p.inW && inShow(p)).forEach(p => {
    if (S.stockRange && p.r !== S.stockRange) return;
    if (q && !(p.t + " " + p.sku + " " + p.col).toLowerCase().includes(q)) return;
    const g = m.get(p.t) || { t: p.t, r: p.r, img: p.img, col: p.col, status: p.status, vars: [] }; g.vars.push(p); m.set(p.t, g);
  });
  return [...m.values()].map(g => {
    const st = g.vars.map(v => STOCK[v.sku]);
    g.avail = st.reduce((s, x) => s + x.avail, 0); g.s30 = st.reduce((s, x) => s + x.s30, 0);
    g.out = st.filter(x => x.state === "out").length; g.low = st.filter(x => x.state === "low").length;
    g.state = g.out ? "out" : g.low ? "low" : "ok";
    return g;
  }).filter(g => S.stockShow !== "hidden" || g.vars.some(v => STOCK[v.sku].avail !== 0))
    .filter(g => !S.stockState || (S.stockState === "out" ? g.out : S.stockState === "low" ? g.low || g.out : g.state === "ok"))
    .sort((a, b) => a.avail - b.avail || b.s30 - a.s30);
}

function matrix(g) {
  const sizes = [...new Set(g.vars.map(v => v.size || "One size"))].sort(sizeSort), cols = [...new Set(g.vars.map(v => v.col))];
  return `<table class="mx"><thead><tr><th></th>${sizes.map(s => `<th>${esc(s)}</th>`).join("")}</tr></thead><tbody>
  ${cols.map(c => `<tr><td><span class="sw" style="background:${hexFor(c)}"></span> ${esc(c)}</td>${sizes.map(s => { const v = g.vars.find(x => x.col === c && (x.size || "One size") === s); if (!v) return `<td class="muted">·</td>`; const k = STOCK[v.sku]; return `<td class="${qtyCls(k)}">${N(k.avail)}</td>`; }).join("")}</tr>`).join("")}
  </tbody></table>`;
}

VIEWS.products = () => {

  const units = all.reduce((s, x) => s + x.avail, 0), out = all.filter(x => x.state === "out").length, low = all.filter(x => x.state === "low").length, s30 = all.reduce((s, x) => s + x.s30, 0);
  const ranges = [...new Set(CATALOG.map(p => p.r))].filter(r => r !== "Other").sort();

        <div class="pbody">
          <div><h3>${esc(g.t)}</h3><span class="muted">${esc(g.r)} · ${g.vars.length} variant${g.vars.length > 1 ? "s" : ""}</span></div>

      ${vars.map(p => { const k = STOCK[p.sku]; return `<tr class="click" data-prod="${esc(p.t)}"><td><div class="prod">${thumb(p)}<span>${esc(p.t)}</span></div></td><td>${p.sku}</td><td>${esc(p.size)}</td><td><span class="sw" style="background:${hexFor(p.col)}"></span> ${esc(p.col)}</td>
        <td class="n"><b class="${qtyCls(k)}">${N(k.avail)}</b></td><td class="n">${N(k.s7)}</td><td class="n">${N(k.s30)}</td><td class="n">${k.cover >= 999 ? "No sales" : k.cover}</td><td>${stPill(k.state)}</td></tr>`; }).join("")}
      </tbody></table></div></section>`;
  }
  return `<div class="grid">
    ${kpi("Pairs available", N(units), `<span>${locName(S.stockLoc)}</span>`, true)}
    ${kpi("Out of stock", N(out), `<span class="muted">SKUs at zero</span>`)}

  </div>
  <section class="card c12"><div class="bar">
    <div class="seg" role="group" aria-label="Location"><button data-sl="" class="${!S.stockLoc ? "on" : ""}">All locations</button>${LOCS.map(l => `<button data-sl="${l.id}" class="${S.stockLoc === l.id ? "on" : ""}">${l.name.replace("Gilnokie ", "")}</button>`).join("")}</div>
    <div class="seg" role="group" aria-label="Layout"><button data-sv="catalogue" class="${S.stockView === "catalogue" ? "on" : ""}">Catalogue</button><button data-sv="table" class="${S.stockView === "table" ? "on" : ""}">Table</button></div>
    <input class="sel grow" id="sq" placeholder="Search products" value="${esc(S.stockQ)}">

    <select class="sel" data-s="stockShow" aria-label="Shopify status"><option value="">On sale</option><option value="hidden" ${S.stockShow === "hidden" ? "selected" : ""}>Not on sale</option></select>
    <select class="sel" data-s="stockState" aria-label="Stock status"><option value="">All stock</option>${[["low", "Low or out"], ["out", "Out of stock"], ["ok", "In stock"]].map(([v, l]) => `<option value="${v}" ${S.stockState === v ? "selected" : ""}>${l}</option>`).join("")}</select>
    <span class="muted">${N(prods.length)} product${prods.length === 1 ? "" : "s"}</span>
    <span class="grow-sp"></span><button class="btn ghost" data-sa="count">Stock take</button><button class="btn" data-sa="production">Add production</button>
  </div></section>

/* ===== LIVE ACTIONS: transfers, stock takes, production, events, settings (replace the sample forms) ===== */
const productLabel = p => `${p.t} · ${p.size || "One size"} · ${p.col}${p.realSku ? " · " + p.realSku : ""}`;
const pickable = () => CATALOG.filter(p => p.vid && p.status !== "archived");
const datalist = () => `<datalist id="prodList">${pickable().map(p => `<option value="${esc(productLabel(p))}"></option>`).join("")}</datalist>`;
function findProduct(text) {
  const t = String(text || "").trim(); if (!t) return null;
  const list = pickable();
  return list.find(p => p.barcode && p.barcode === t) || list.find(p => p.realSku && p.realSku.toLowerCase() === t.toLowerCase())
    || list.find(p => productLabel(p) === t) || list.find(p => productLabel(p).toLowerCase().includes(t.toLowerCase())) || null;
}
const locOptions = (sel, list = ALL_LOCS.filter(l => l.active)) => list.map(l => `<option value="${l.id}" ${String(sel) === l.id ? "selected" : ""}>${esc(l.name)}</option>`).join("");
const factoryId = () => (ALL_LOCS.find(l => l.raw === "factory") || LOCS[0] || {}).id;
const eventsLocId = () => (ALL_LOCS.find(l => l.raw === "events") || {}).id;
function toast(msg, bad) { const t = document.createElement("div"); t.className = "toast" + (bad ? " bad" : ""); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 4000); }
const drawer = html => { $("#drawer").innerHTML = html; $("#drawer").classList.add("on"); };

/* ---------- transfers ---------- */
let TR = null; // transfer being built
openTransferForm = function () {
  TR = { from: factoryId(), to: eventsLocId() || LOCS[1]?.id, event: "", lines: [] };
  renderTransfer();
};
function renderTransfer(msg) {
  const total = TR.lines.reduce((s, l) => s + l.qty, 0);
  const ev = EVENTS.find(e => String(e.id) === String(TR.event));
  drawer(`<header><h3>New transfer</h3><button id="closeDrawer" aria-label="Close">✕</button></header>
  <div class="body">
    <div class="form">
      <label for="trFrom">From</label><select class="sel" id="trFrom">${locOptions(TR.from)}</select>
      <label for="trTo">To</label><select class="sel" id="trTo">${locOptions(TR.to)}</select>
      <label for="trEv">Event tag</label><select class="sel" id="trEv"><option value="">No event</option>${EVENTS.map(e => `<option value="${e.id}" ${String(TR.event) === String(e.id) ? "selected" : ""}>#${esc(e.tag)}</option>`).join("")}</select>
    </div>
    <section class="card"><div class="hd"><h2>Scan or search items</h2><small>Scanners type straight in. Press Enter to add</small></div>
      <input class="inp" id="scan" list="prodList" placeholder="Scan barcode, SKU or type a product name" style="width:100%" autocomplete="off">${datalist()}
      ${msg ? `<p class="err" style="margin:0">${esc(msg)}</p>` : ""}
      <div class="tw"><table><thead><tr><th>Product</th><th class="n">At origin</th><th class="n">Qty</th><th></th></tr></thead><tbody>
        ${TR.lines.map((l, i) => { const p = BY_SKU[l.key]; return `<tr><td><div class="prod">${thumb(p)}<span>${esc(p.t)}<div class="muted">${esc(p.size)} · ${esc(p.col)}</div></span></div></td>
          <td class="n">${N(STOCK[l.key]?.byLoc[TR.from] ?? 0)}</td>
          <td class="n"><div class="qty"><button data-q="${i}:-1" aria-label="Less">−</button><input class="qin" data-qi="${i}" type="number" min="1" value="${l.qty}"><button data-q="${i}:1" aria-label="More">+</button></div></td>
          <td><button class="x" data-rm="${i}" aria-label="Remove">✕</button></td></tr>`; }).join("") || `<tr><td colspan="4" class="empty">Scan or search to add items</td></tr>`}
      </tbody></table></div></section>
    <dl class="kv"><dt>Total pairs</dt><dd><b>${N(total)}</b></dd><dt>Effect in Shopify</dt><dd>${esc(locName(TR.from))} −${N(total)}, ${esc(locName(TR.to))} +${N(total)}${ev ? `, tagged #${esc(ev.tag)}` : ""}</dd></dl>
    <div class="bar"><button class="btn" id="trDone" ${total ? "" : "disabled"}>Complete transfer</button><button class="btn ghost" id="trDraft" ${total ? "" : "disabled"}>Save as draft</button></div>
  </div>`);
  setTimeout(() => $("#scan")?.focus(), 50);
}
function addLine(text) {
  const p = findProduct(text);
  if (!p) return renderTransfer(`Nothing found for "${text}"`);
  const l = TR.lines.find(x => x.key === p.sku);
  l ? l.qty++ : TR.lines.push({ key: p.sku, vid: p.vid, qty: 1 });
  renderTransfer();
}
async function saveTransfer(complete) {
  if (TR.from === TR.to) return renderTransfer("From and To must be different locations");
  const btn = $(complete ? "#trDone" : "#trDraft"); btn.disabled = true; btn.textContent = "Saving…";
  const { data: t, error } = await sb.from("transfers").insert({ from_location: Number(TR.from), to_location: Number(TR.to), event_id: TR.event ? Number(TR.event) : null }).select("id").single();
  if (error) return renderTransfer(error.message);
  const { error: e2 } = await sb.from("transfer_lines").insert(TR.lines.map(l => ({ transfer_id: t.id, variant_id: l.vid, qty: l.qty })));
  if (e2) return renderTransfer(e2.message);
  if (complete) {
    const { error: e3 } = await sb.rpc("complete_transfer", { p_transfer: t.id });
    if (e3) return renderTransfer(e3.message);
    pushNow();
  }
  $("#drawer").classList.remove("on");
  toast(complete ? `Transfer TR-${t.id} done.${SETTINGS.push_enabled === true ? " Shopify updates within a minute." : ""}` : `Draft TR-${t.id} saved.`);
  refresh();
}

/* ---------- stock take and production ---------- */
let SA = null;
openStockAction = function (kind) { SA = { kind, loc: S.stockLoc || factoryId(), p: null, qty: "" }; renderStockAction(); };
function renderStockAction(msg) {
  const k = SA.p ? STOCK[SA.p.sku] : null, cur = k ? (k.byLoc[SA.loc] ?? 0) : null, q = Number(SA.qty);
  const after = SA.qty === "" || !k ? "—" : N(SA.kind === "count" ? q : cur + q);
  drawer(`<header><h3>${SA.kind === "count" ? "Stock take" : "Add production"}</h3><button id="closeDrawer" aria-label="Close">✕</button></header>
  <div class="body">
    <div class="form">
      <label for="saLoc">Location</label><select class="sel" id="saLoc">${locOptions(SA.loc, LOCS)}</select>
      <label for="saScan">Product</label><input class="inp" id="saScan" list="prodList" placeholder="Scan barcode or search" value="${SA.p ? esc(productLabel(SA.p)) : ""}" autocomplete="off">${datalist()}
      <label for="saQty">${SA.kind === "count" ? "Counted on the shelf" : "Pairs made"}</label><input class="inp" id="saQty" type="number" min="${SA.kind === "count" ? 0 : 1}" value="${SA.qty}">
    </div>
    ${msg ? `<p class="err" style="margin:0">${esc(msg)}</p>` : ""}
    <dl class="kv"><dt>Currently in the app</dt><dd>${cur == null ? "Pick a product" : N(cur)}</dd><dt>After saving</dt><dd><b>${after}</b></dd><dt>Shopify retail</dt><dd>${SETTINGS.push_enabled === true ? "Updated automatically within a minute" : "Not sent yet. Sending switches on at go-live"}</dd></dl>
    <div class="bar"><button class="btn" id="saSave" ${SA.p && SA.qty !== "" ? "" : "disabled"}>${SA.kind === "count" ? "Save count" : "Add to stock"}</button></div>
  </div>`);
}
async function saveStockAction() {
  const q = Number(SA.qty);
  if (!Number.isInteger(q) || q < 0 || (SA.kind !== "count" && q === 0)) return renderStockAction("Enter a whole number");
  $("#saSave").disabled = true;
  const r = SA.kind === "count"
    ? await sb.rpc("stock_count", { p_variant: SA.p.vid, p_location: Number(SA.loc), p_counted: q, p_note: null })
    : await sb.rpc("stock_add", { p_variant: SA.p.vid, p_location: Number(SA.loc), p_qty: q, p_kind: "production", p_note: null });
  if (r.error) return renderStockAction(r.error.message);
  pushNow();
  $("#drawer").classList.remove("on");
  toast(SA.kind === "count" ? "Count saved." : `${q} pairs added.`);
  refresh();
}

openEventForm = function (msg) {
  drawer(`<header><h3>New event</h3><button id="closeDrawer" aria-label="Close">✕</button></header>
  <div class="body">
    <div class="form">
      <label for="evName">Event name</label><input class="inp" id="evName" placeholder="e.g. Comrades 2026">
      <label for="evTag">Tag</label><input class="inp" id="evTag" placeholder="comrades-2026">
      <label for="evFrom">First day</label><input class="inp" id="evFrom" type="date">
      <label for="evTo">Last day</label><input class="inp" id="evTo" type="date">
    </div>
    ${typeof msg === "string" ? `<p class="err" style="margin:0">${esc(msg)}</p>` : ""}
    <p class="muted" style="margin:0">POS sales at the Events location between these dates count towards this event. Pick the tag on every transfer to and from it.</p>
    <div class="bar"><button class="btn" id="evSave">Create event</button></div>
  </div>`);
};
async function saveEvent() {
  const name = $("#evName").value.trim(), tag = ($("#evTag").value.trim() || name).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const from = $("#evFrom").value, to = $("#evTo").value || from;
  if (!name || !from) return openEventForm("Add a name and the first day");
  const { error } = await sb.from("events").insert({ name, tag, starts_on: from, ends_on: to });
  if (error) return openEventForm(error.message.includes("unique") ? "That tag is already used" : error.message);
  $("#drawer").classList.remove("on"); toast("Event created."); refresh();
}

/* ---------- system (live) ---------- */
const ago = d => { const m = Math.round((Date.now() - new Date(d)) / 60000); return m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) + " days ago"; };

  const what = c.store_id === "retail" ? "Orders, refunds and products. Stock is sent back to this store" : "Orders and refunds. Wholesale orders take stock from the Factory";
  const hook = c.last_webhook ? `Last update from Shopify ${ago(c.last_webhook)}` : "No updates received from Shopify yet";
  const pill = c.webhook_errors ? `<span class="pill p-bad">Errors</span>` : c.last_webhook ? `<span class="pill p-good">Connected</span>` : `<span class="pill p-warn">Waiting</span>`;
  return `<div class="row"><span><b>${esc(c.store_name)}</b><div class="muted">${what}</div><div class="muted">${hook} · ${N(c.orders)} orders since 1 Nov</div></span>${pill}</div>`;
};

    <section class="card c6"><h2>Connections</h2>
      <div class="list">
        ${(CHECKS.conn || []).map(connRow).join("")}

    <section class="card c6"><h2>Data checks</h2>

      </div></section>
    <section class="card c6"><h2>Locations</h2>
      <div class="list">${ALL_LOCS.map(l => `<div class="row"><span>${esc(l.name)}</span>${ROLE === "admin" ? `<select class="sel" data-lk="${l.id}" aria-label="Type for ${esc(l.name)}">${["factory","store","events","customer","other"].map(k => `<option value="${k}" ${l.raw === k ? "selected" : ""}>${k[0].toUpperCase() + k.slice(1)}</option>`).join("")}</select>` : `<b>${l.kind}</b>`}</div>`).join("")}</div>
      <p class="muted" style="margin:0">Factory: online and wholesale orders ship from here. Events: event reports use this location. Customer: stock sent here counts as sold (Takealot).</p></section>
    <section class="card c6 kpi hero"><span class="lbl">Signed in as</span><span class="val" style="font-size:22px">${esc($("#who").textContent)}</span><span style="color:#bdbdbd">Role: ${ROLE === "admin" ? "Admin (everything)" : "Factory (stock, transfers, events, yarn)"}</span>
      <div class="bar"><button class="btn" id="reload">Refresh data</button><button class="btn ghost" id="signOut">Sign out</button></div>
      <span style="color:#bdbdbd">Powered by Fetchwave</span></section>
  </div>`;
};

/* ---------- wiring ---------- */
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "scan") { e.preventDefault(); addLine(e.target.value); }
});
document.addEventListener("change", async e => {
  const id = e.target.id;
  if (id === "trFrom") { TR.from = e.target.value; renderTransfer(); }
  if (id === "trTo") { TR.to = e.target.value; renderTransfer(); }
  if (id === "trEv") { TR.event = e.target.value; renderTransfer(); }
  if (id === "scan" && findProduct(e.target.value) && productLabel(findProduct(e.target.value)) === e.target.value.trim()) addLine(e.target.value);
  if (e.target.dataset.qi) { const l = TR.lines[+e.target.dataset.qi]; l.qty = Math.max(1, parseInt(e.target.value) || 1); renderTransfer(); }
  if (id === "saLoc") { SA.loc = e.target.value; renderStockAction(); }
  if (id === "saScan") { SA.p = findProduct(e.target.value); renderStockAction(SA.p ? "" : "Product not found"); }
  if (id === "saQty") { SA.qty = e.target.value; renderStockAction(); }
  if (e.target.dataset.lk) {
    const { error } = await sb.rpc("set_location_kind", { p_location: Number(e.target.dataset.lk), p_kind: e.target.value });
    error ? toast(error.message, true) : (toast("Location updated."), refresh());
  }
});
document.addEventListener("click", e => {
  const q = e.target.closest("[data-q]"); if (q) { const [i, d] = q.dataset.q.split(":").map(Number); TR.lines[i].qty = Math.max(1, TR.lines[i].qty + d); renderTransfer(); }
  const rm = e.target.closest("[data-rm]"); if (rm) { TR.lines.splice(+rm.dataset.rm, 1); renderTransfer(); }
  if (e.target.closest("#trDone")) saveTransfer(true);
  if (e.target.closest("#trDraft")) saveTransfer(false);
  if (e.target.closest("#saSave")) saveStockAction();
  if (e.target.closest("#evSave")) saveEvent();
});

/* ===== PRODUCTS, YARN, SYSTEM ===== */
VIEWS.yarn = () => {
  const tabs = [["recipes", "Recipes"], ["stock", "Yarn stock"], ["production", "Production runs"], ["reorder", "Reorder plan"]];
  const ys = Object.values(YARN), kg = ys.reduce((s, y) => s + y.stock, 0), use = ys.reduce((s, y) => s + y.used30, 0);
  const urgent = ys.filter(y => y.state === "bad");
  let body = "";
  if (S.yarnTab === "recipes") {
    const items = sellable.filter(p => recipe(p) && (!S.f.q || (p.t + p.sku).toLowerCase().includes(S.f.q.toLowerCase()))).slice(0, 120);
    body = `<section class="card c12"><div class="hd"><h2>Recipe per pair</h2><input class="sel" id="q" placeholder="Search product or SKU" value="${esc(S.f.q)}" style="min-width:280px"></div>
      <div class="note">Placeholder recipes: 55% polyester (main + accent colour), 41% polyamide, 4% elastane, sized by sock height. The factory replaces these with weighed grams per style and size.</div>
      <div class="tw" style="max-height:560px;overflow:auto"><table><thead><tr><th>Product</th><th>Size</th><th>SKU</th><th>Yarn</th><th class="n">Grams per pair</th></tr></thead><tbody>
      ${items.map(p => recipe(p).map((r, i) => `<tr>${i === 0 ? `<td rowspan="4"><b>${esc(p.t)}</b><div class="muted">${esc(p.col)}</div></td><td rowspan="4">${esc(p.size)}</td><td rowspan="4">${p.sku}</td>` : ""}<td><span class="sw" style="background:${hexFor(r.yarn.split(" ").slice(1).join(" "))}"></span> ${esc(r.yarn)}</td><td class="n">${r.g.toFixed(1)} g</td></tr>`).join("")).join("")}
      </tbody></table></div></section>`;
  } else if (S.yarnTab === "stock") {
    body = `<section class="card c12"><div class="hd"><h2>Yarn on hand</h2><small>Sorted by days of cover</small></div>
      <div class="tw"><table><thead><tr><th>Yarn</th><th>Type</th><th class="n">On hand</th><th class="n">Used (30 days)</th><th>Cover</th><th class="n">Lead time</th><th>Status</th></tr></thead><tbody>
      ${ys.sort((a, b) => a.cover - b.cover).map(y => `<tr><td><span class="sw" style="background:${hexFor(y.colour)}"></span> <b>${esc(y.yarn)}</b></td><td>${y.type}</td><td class="n">${y.stock.toFixed(1)} kg</td><td class="n">${y.used30.toFixed(1)} kg</td>
        <td><div style="display:flex;gap:10px;align-items:center"><div class="bar-in" style="width:120px"><i class="${y.state === "bad" ? "lo" : y.state === "warn" ? "mid" : ""}" style="width:${Math.min(100, y.cover / 90 * 100)}%"></i></div>${y.cover > 365 ? "365+" : y.cover} days</div></td>
        <td class="n">${y.lead} days</td><td><span class="pill p-${y.state}">${y.state === "bad" ? "Order now" : y.state === "warn" ? "Order soon" : "OK"}</span></td></tr>`).join("")}
      </tbody></table></div></section>`;
  } else if (S.yarnTab === "production") {
    body = `<section class="card c12"><div class="hd"><h2>Production runs</h2><small>Stock added in the wholesale store shows here</small></div>
      <div class="tw"><table><thead><tr><th>Run</th><th>Date</th><th>Product</th><th>Size</th><th>Colour</th><th class="n">Pairs</th><th>Machine</th><th class="n">Yarn used</th><th>Status</th></tr></thead><tbody>
      ${RUNS.map(r => { const p = BY_SKU[r.sku], g = (recipe(p) || []).reduce((s, x) => s + x.g, 0) * r.qty; return `<tr><td><b>${r.id}</b></td><td>${dShort(r.at)}</td><td>${esc(p.t)}</td><td>${esc(p.size)}</td><td><span class="sw" style="background:${hexFor(p.col)}"></span> ${esc(p.col)}</td><td class="n">${N(r.qty)}</td><td>${r.machine}</td><td class="n">${(g / 1000).toFixed(1)} kg</td><td><span class="pill ${r.status === "Complete" ? "p-good" : "p-warn"}">${r.status}</span></td></tr>`; }).join("")}
      </tbody></table></div></section>`;
  } else {
    const need = ys.filter(y => y.reorderKg > 0).sort((a, b) => a.cover - b.cover);
    body = `<section class="card c12"><div class="hd"><h2>What to order</h2><small>Covers lead time plus 30 days of sales</small></div>
      <div class="tw"><table><thead><tr><th>Yarn</th><th class="n">On hand</th><th class="n">Daily use</th><th class="n">Lead time</th><th>Order by</th><th class="n">Order qty</th><th class="n">Cones</th></tr></thead><tbody>
      ${need.map(y => { const by = addDays(NOW, Math.max(0, y.cover - y.lead)); return `<tr><td><span class="sw" style="background:${hexFor(y.colour)}"></span> <b>${esc(y.yarn)}</b></td><td class="n">${y.stock.toFixed(1)} kg</td><td class="n">${(y.daily * 1000).toFixed(0)} g</td><td class="n">${y.lead} days</td>
        <td><span class="pill p-${y.state}">${y.cover <= y.lead ? "Today" : dShort(by)}</span></td><td class="n"><b>${y.reorderKg} kg</b></td><td class="n">${y.reorderKg / y.cone}</td></tr>`; }).join("") || `<tr><td colspan="7" class="empty">Nothing to order right now</td></tr>`}
      </tbody></table></div></section>`;
  }
  return `<div class="grid">
    ${kpi("Yarn on hand", kg.toFixed(0) + " kg", "", true)}
    ${kpi("Used last 30 days", use.toFixed(0) + " kg", "")}
    ${kpi("Yarns to order now", N(urgent.length), `<span class="muted">Cover below lead time</span>`)}
    ${kpi("Runs this week", N(RUNS.filter(r => NOW - r.at < 7 * 864e5).length), `<span class="muted">${N(RUNS.filter(r => NOW - r.at < 7 * 864e5).reduce((s, r) => s + r.qty, 0))} pairs</span>`)}
  </div>
  <div class="tabs">${tabs.map(([k, l]) => `<button data-tab="${k}" class="${S.yarnTab === k ? "on" : ""}">${l}</button>`).join("")}</div>
  ${body}`;
};

if (!VIEWS.system) VIEWS.system = () => `
  <div class="grid">
    <section class="card c6"><h2>Store connections</h2>
      <div class="list">
        <div class="row"><span><b>Gilnokie Retail</b><div class="muted">gilnokie.com · orders, refunds, cancellations</div></span><span class="pill p-warn">Not connected</span></div>
        <div class="row"><span><b>Gilnokie Wholesale</b><div class="muted">Wholesale store · orders, refunds, cancellations</div></span><span class="pill p-warn">Not connected</span></div>

        <div class="row"><span><b>Go-live</b><div class="muted">Orders and stock subtraction start from this date</div></span><b>1 Nov 2026</b></div>
      </div></section>
    <section class="card c6"><h2>Reporting settings</h2>
      <dl class="kv"><dt>Time zone</dt><dd>Africa/Johannesburg</dd><dt>Currency</dt><dd>ZAR, VAT inclusive</dd><dt>Week starts</dt><dd>Monday</dd><dt>Sales counted</dt><dd>Net of discounts and refunds, excluding shipping</dd></dl></section>
    <section class="card c6"><h2>Data checks</h2>
      <div class="list">
        <div class="row"><span>Retail variants without a SKU</span><span class="pill p-bad">72</span></div>
        <div class="row"><span>Duplicate SKUs in wholesale</span><span class="pill p-bad">14</span></div>
        <div class="row"><span>Energiser listed twice in wholesale, stock on both (679 and 777)</span><span class="pill p-bad">Merge</span></div>
        <div class="row"><span>Retail variants matched to wholesale by name and colour</span><span class="pill p-warn">5 to check</span></div>
        <div class="row"><span>Retail-only products with no stock in the wholesale store</span><span class="pill p-warn">${CATALOG.filter(p => p.inR && !p.inW).length} SKUs</span></div>
        <div class="row"><span>Real yarn recipes loaded</span><span class="pill p-warn">0 of ${sellable.length}</span></div>
      </div></section>
    <section class="card c6 kpi hero"><span class="lbl">Built and maintained by</span><span class="val" style="font-size:28px">Powered by Fetchwave</span><span style="color:#bdbdbd">Custom stock, sales and production system for Gilnokie.</span></section>
  </div>`;

if (typeof BOOT === "function") BOOT(); else route();
</script>
